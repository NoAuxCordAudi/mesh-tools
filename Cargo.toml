[package]
name = "mesh-tools"
version = "0.18.0"
edition = "2021"
authors = ["Michael Blazej"]
description = "A Rust library for generating 3D meshes and exporting them to glTF/GLB files"
license = "MIT"
repository = "https://github.com/michaelblazej/mesh-tools"
homepage = "https://github.com/michaelblazej/mesh-tools"
documentation = "https://docs.rs/mesh-tools/0.9.0/mesh_tools/"
keywords = ["gltf", "3d", "mesh", "export", "graphics"]
categories = ["graphics", "rendering", "game-development", "simulation"]
include = ["src/**/*.rs", "docs/*.md", "Cargo.toml", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
# For serializing/deserializing JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# For binary data manipulation
byteorder = "1.4"
base64 = "0.13"
# For managing errors
thiserror = "1.0"
# For generating UUIDs
uuid = { version = "1.0", features = ["v4"] }
# For handling basic data types
mint = "0.5.9"
# For image processing and texture generation
image = "0.24"

[[example]]
name = "simple_box"
path = "examples/simple_box.rs"

[[example]]
name = "materials_demo"
path = "examples/materials_demo.rs"

[[example]]
name = "texture_demo"
path = "examples/texture_demo.rs"

[[example]]
name = "hierarchy_demo"
path = "examples/hierarchy_demo.rs"

[[example]]
name = "custom_mesh_demo"
path = "examples/custom_mesh_demo.rs"

[[example]]
name = "primitives_demo"
path = "examples/primitives_demo.rs"

[[example]]
name = "instancing_demo"
path = "examples/instancing_demo.rs"

[[example]]
name = "terrain_demo"
path = "examples/terrain_demo.rs"

[[example]]
name = "animation_demo"
path = "examples/animation_demo.rs"

[[example]]
name = "skeletal_animation_demo"
path = "examples/skeletal_animation_demo.rs"

[[example]]
name = "morph_demo"
path = "examples/morph_demo.rs"

[dev-dependencies]
# Independent reference loader used by integration tests to read exported GLBs back
# The extra features let tests read extras, extension payloads and (deprecated) specular-glossiness
# and texture-transform data back, for the milestones that write them.
gltf = { version = "1", features = ["extras", "extensions", "names", "KHR_materials_pbrSpecularGlossiness", "KHR_texture_transform"] }
