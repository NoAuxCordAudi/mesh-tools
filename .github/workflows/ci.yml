name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build everything
        run: cargo build --all-targets
      - name: Unit, integration and doc tests
        run: cargo test --all-targets && cargo test --doc
      - name: Skeletal demo exports a valid file
        run: cargo run --example skeletal_animation_demo -- "$RUNNER_TEMP/arm.glb"
      - name: Morph demo exports and verifies its own output
        run: cargo run --example morph_demo -- "$RUNNER_TEMP/morph.glb"
